name: bounded native handoff reproduction

on:
  pull_request:
    branches: [codex/sortit-failure-evidence]

permissions:
  contents: read

jobs:
  legacy-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        polling: [original, quiet]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: prepare the exact shipped legacy install
        run: |
          git worktree add --detach "$RUNNER_TEMP/sortit-legacy" d9949e6263e98323a985ae8f09762a39ecadc335
          npm ci --prefix "$RUNNER_TEMP/sortit-legacy"
          npm run build --prefix "$RUNNER_TEMP/sortit-legacy"
          echo "SORTIT_PWA_WORK_ROOT=$RUNNER_TEMP/native-repro" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native-repro"
      - run: node tools/verify-pwa.mjs --legacy "$RUNNER_TEMP/sortit-legacy/build" --prepare-only
      - name: compare original messages with passive handoff observation
        env:
          SORTIT_QUIET_HANDOFF: ${{ matrix.polling == 'quiet' && '1' || '' }}
        run: |
          manifests=("$SORTIT_PWA_WORK_ROOT"/sortit-pwa-*/artifacts.json)
          test "${#manifests[@]}" -eq 1
          DEBUG=pw:browser \
          SORTIT_PWA_ARTIFACTS="${manifests[0]}" \
          SORTIT_PWA_OUTPUT="$SORTIT_PWA_WORK_ROOT/repeat-results" \
          npx playwright test --config playwright.pwa.config.js --project chromium \
            --grep 'a new page finishes an already-waiting legacy handoff' --repeat-each=50 --max-failures=1 \
            > "$SORTIT_PWA_WORK_ROOT/native-browser.log" 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: legacy-handoff-${{ matrix.polling }}-evidence
          path: |
            ${{ runner.temp }}/native-repro/repeat-results/
            ${{ runner.temp }}/native-repro/native-browser.log
          retention-days: 7
