name: bounded native update reproduction

on:
  pull_request:
    branches: [codex/sortit-failure-evidence]

permissions:
  contents: read

jobs:
  native-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        online-command: [original, omitted]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: echo "SORTIT_PWA_WORK_ROOT=$RUNNER_TEMP/native-repro" >> "$GITHUB_ENV"
      - run: mkdir -p "$SORTIT_PWA_WORK_ROOT"
      - run: node tools/verify-pwa.mjs
      - name: repeat the original retry sequence with its preceding consent case
        env:
          SORTIT_SKIP_WEBKIT_ONLINE: ${{ matrix.online-command == 'omitted' && '1' || '' }}
        run: |
          manifests=("$SORTIT_PWA_WORK_ROOT"/sortit-pwa-*/artifacts.json)
          test "${#manifests[@]}" -eq 1
          node tools/native-process-observer.mjs > "$SORTIT_PWA_WORK_ROOT/native-processes.jsonl" &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true' EXIT
          DEBUG=pw:browser \
          SORTIT_PWA_ARTIFACTS="${manifests[0]}" \
          SORTIT_PWA_OUTPUT="$SORTIT_PWA_WORK_ROOT/repeat-results" \
          npx playwright test --config playwright.pwa.config.js --project webkit \
            --grep 'consent updates|a failed new-asset download' --repeat-each=50 --max-failures=1 \
            > "$SORTIT_PWA_WORK_ROOT/native-browser.log" 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-retry-${{ matrix.online-command }}-evidence
          path: |
            ${{ runner.temp }}/native-repro/**/results/
            ${{ runner.temp }}/native-repro/repeat-results/
            ${{ runner.temp }}/native-repro/native-browser.log
            ${{ runner.temp }}/native-repro/native-processes.jsonl
          retention-days: 7
