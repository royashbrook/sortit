name: bounded native library identity

on:
  pull_request:
    branches: [codex/sortit-failure-evidence]

permissions:
  contents: read

jobs:
  native-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node tools/native-library-identity.mjs --test
      - run: npx playwright install --with-deps webkit
      - name: identify the loaded library without debugger attachment
        run: |
          ulimit -c 0
          node tools/native-library-identity.mjs > "$RUNNER_TEMP/native-library-identity.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-library-identity
          path: ${{ runner.temp }}/native-library-identity.json
          retention-days: 7
