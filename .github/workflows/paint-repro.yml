name: bounded native network stack capture

on:
  pull_request:
    branches: [codex/sortit-failure-evidence]

permissions:
  contents: read

jobs:
  native-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y gdb
      - name: prepare the fixture directory
        run: |
          echo "SORTIT_PWA_WORK_ROOT=$RUNNER_TEMP/native-repro" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native-repro"
      - run: node tools/verify-pwa.mjs --prepare-only
      - name: follow the isolated synthetic browser family to an abort
        run: |
          manifests=("$SORTIT_PWA_WORK_ROOT"/sortit-pwa-*/artifacts.json)
          test "${#manifests[@]}" -eq 1
          ulimit -c 0
          DEBUG=pw:browser \
            gdb -nx --batch --return-child-result --command tools/native-network-debugger.gdb \
            --args node tools/native-cache-repro.mjs "${manifests[0]}" 100 controller shared \
            > "$SORTIT_PWA_WORK_ROOT/native-browser.log" 2>&1
      - name: refuse an uninstrumented result
        if: always()
        run: |
          grep -q 'native-family-debugger-started' "$SORTIT_PWA_WORK_ROOT/native-browser.log"
          grep -q 'WPENetworkProcess' "$SORTIT_PWA_WORK_ROOT/native-browser.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-network-stack-evidence
          path: |
            ${{ runner.temp }}/native-repro/native-browser.log
          retention-days: 7
