name: actual worker without game reproduction

on:
  pull_request:
    branches: [codex/sortit-failure-evidence]

permissions:
  contents: read

jobs:
  native-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y strace
      - name: prepare the fixture directory
        run: |
          echo "SORTIT_PWA_WORK_ROOT=$RUNNER_TEMP/native-repro" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native-repro"
      - run: node tools/verify-pwa.mjs --prepare-only
      - name: isolate the real worker without the game runtime
        run: |
          manifests=("$SORTIT_PWA_WORK_ROOT"/sortit-pwa-*/artifacts.json)
          test "${#manifests[@]}" -eq 1
          node tools/native-process-observer.mjs > "$SORTIT_PWA_WORK_ROOT/native-processes.jsonl" &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true' EXIT
          DEBUG=pw:browser \
          strace -f -qq -ttt -e trace=clone,clone3,exit_group,wait4,waitid -e signal=all \
            -o "$SORTIT_PWA_WORK_ROOT/native-signals.log" \
            node tools/native-cache-repro.mjs "${manifests[0]}" 50 actual \
            > "$SORTIT_PWA_WORK_ROOT/native-browser.log" 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: actual-worker-evidence
          path: |
            ${{ runner.temp }}/native-repro/native-browser.log
            ${{ runner.temp }}/native-repro/native-processes.jsonl
            ${{ runner.temp }}/native-repro/native-signals.log
          retention-days: 7
