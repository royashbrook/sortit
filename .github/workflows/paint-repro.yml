name: bounded native network stack capture

on:
  pull_request:
    branches: [codex/sortit-failure-evidence]

permissions:
  contents: read

jobs:
  native-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y gdb
      - name: prepare the fixture directory
        run: |
          echo "SORTIT_PWA_WORK_ROOT=$RUNNER_TEMP/native-repro" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/native-repro"
      - run: node tools/verify-pwa.mjs --prepare-only
      - name: capture only the synthetic network process stack
        run: |
          manifests=("$SORTIT_PWA_WORK_ROOT"/sortit-pwa-*/artifacts.json)
          test "${#manifests[@]}" -eq 1
          chmod +x tools/native-network-debugger.sh
          DEBUG=pw:browser \
          NETWORK_PROCESS_CMD_PREFIX="$PWD/tools/native-network-debugger.sh" \
            node tools/native-cache-repro.mjs "${manifests[0]}" 100 controller shared \
            > "$SORTIT_PWA_WORK_ROOT/native-browser.log" 2>&1
      - name: refuse an uninstrumented result
        if: always()
        run: |
          logs=("$SORTIT_PWA_WORK_ROOT"/network-gdb.*.log)
          test -f "${logs[0]}"
          grep -q 'network debugger started:' "${logs[@]}"
          grep -q 'libthread_db' "${logs[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-network-stack-evidence
          path: |
            ${{ runner.temp }}/native-repro/native-browser.log
            ${{ runner.temp }}/native-repro/network-gdb.*.log
          retention-days: 7
