name: deploy sortit.royashbrook.com

# The game deploys ITSELF, the same pattern as craftrush / scoopaloo / quarry:
# pushing to main ships it to its own Cloudflare origin.
on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sortit-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history so the build stamps a real git-tag version, not 0.0.0-dev
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # the verifier IS the test suite: every level + 3 years of dailies must be
      # solvable, deterministic, and pars must match the exact solver before deploy
      - run: npm run verify
      - run: npm run build
      - name: check the build is present
        run: |
          test -f build/index.html
          test -f build/service-worker.js
          test -f build/manifest.json
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. add the repo secret to enable deploys."
            exit 1
          fi
          npx wrangler deploy
