name: pr check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: build the pinned pre-migration app
        run: |
          git worktree add --detach "$RUNNER_TEMP/sortit-legacy" d9949e6263e98323a985ae8f09762a39ecadc335
          npm ci --prefix "$RUNNER_TEMP/sortit-legacy"
          npm run build --prefix "$RUNNER_TEMP/sortit-legacy"
      # the public copy carries no banned claim (false-privacy, em-dash), scanning
      # *.md/*.html AND *.svelte so the about/footer/maker-mark text is covered
      - run: npm run lint:copy
      # the deterministic guarantee: every level + 3 years of dailies solvable,
      # pars exact against the solver, determinism, star invariants
      - run: npm run verify
      # the shell compiles and typechecks, and the static build succeeds
      - run: npm run svelte-check
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run e2e
      - run: npm run e2e:first-run
      - run: node tools/verify-pwa.mjs --legacy "$RUNNER_TEMP/sortit-legacy/build"
        env:
          SORTIT_PWA_WORK_ROOT: ${{ runner.temp }}
      - run: npm run verify:artifact
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            ${{ runner.temp }}/sortit-pwa-*/results/
          retention-days: 7
